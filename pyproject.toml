[project]
name = "maibot-lunagentic-research-swarm"
version = "0.1.0"
description = "麦麦深度调查组：可扩展的多智能体深度研究蜂群"
requires-python = ">=3.10"
dependencies = [
    "maibot-plugin-sdk>=2.7.1,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "httpx>=0.28.0,<0.29.0",
    "ddgs>=9.14.4,<10.0.0",
    "lancedb>=0.34.0,<0.35.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0,<7.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lunagentic_research_swarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_llm: 需要仓库根 .debug_api_call_credentials 的真实 LLM 调用",
    "live_llm_e2e: A/B 端到端（seed formalize + light judge）",
    "live_llm_thorough: stub tools 深度调研 + deep judge",
    "live_llm_live_tools: 真实 web_search + live LLM + deep judge",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F822"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841"]
