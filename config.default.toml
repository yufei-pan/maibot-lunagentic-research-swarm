# 麦麦深度调查组（Lunagentic Research Swarm）默认配置模板。
# 复制为 config.toml 后按需修改。不要把含密钥的 live config 提交到版本库。

[plugin]
config_version = "1.0.0"
enabled = true
root_agent = "builtin.quick_thinker"

[llm]
force_selector = ""

[summarizer]
selector = "task:mid_memory"
temperature = 0.2
max_tokens = 0

[embedding]
selector = "task:embedding"
batch_size = 32
max_concurrent = 4
auto_rebuild = true
retired_generation_retention_seconds = 86400

[timing]
default_time_budget_seconds = 120
grace_period_seconds = 60
pause_timeout_seconds = 1200
feedback_wait_seconds = 600

[budget]
default_effort_credits = 100.0
warning_miss_input_tokens = 500000
warning_output_tokens = 50000

[scheduler]
max_task_llm_concurrency = 8
max_global_llm_concurrency = 16
max_task_procedure_concurrency = 16
max_delegations_per_turn = 8
max_branch_depth = 32
max_agent_calls_per_task = 256

[context]
auto_compact_tokens = 258000
reserved_output_tokens = 8192
safety_margin_tokens = 8192
# 可选：已知模型上下文窗口（token）。设置后自动压缩会同时参考
# context_window - reserved_output - safety_margin。
# model_context_window = 128000

[protocol]
default_mode = "json_envelope"
max_correction_turns = 1

[storage]
store_agent_transcripts = false
store_raw_procedure_payloads = false

[extensions]
refresh_interval_seconds = 60

# ---------------------------------------------------------------------------
# Note / 注意：插件价格覆盖
# 只要在下方为某物理模型写了条目，就会忽略 Host 中该模型的全部价格字段；
# 未写字段按 0（免费）计。Host 价格优先，仅在需要完整覆盖时使用插件 override。
# 模型配置价格数值 1.0 = 100 credits；界面货币标签（¥/$/€ 等）一律忽略。
# ---------------------------------------------------------------------------
[pricing]

[pricing.models]
# 示例（默认注释掉；取消注释后生效）：
# [pricing.models."example-model"]
# price_in = 0.0
# cache = false
# cache_price_in = 0.0
# price_out = 0.0

[reporting]
max_report_chars = 60000
max_stats_chars = 12000
deliver_intermediate = true
deliver_final = true
outbox_poll_seconds = 2.0

[feedback]
reminders_enabled = true
index_lessons = true
max_lesson_chars = 8000

[commands]
enabled = true
max_output_chars = 12000
# 维护白名单。每项可以是：
#   1) 平台 user_id —— Host 命令 RPC 直接提供，随适配器不同而不同；
#   2) MaiBot person_id —— md5(f"{platform}_{user_id}") 的 32 位 hex，跨适配器唯一，
#      同一 user_id 在不同平台会得到不同 person_id。
# 两种格式不会互相碰撞，可以混填。person_id 由插件用 ctx.person.get_id 现算比对。
# 空列表 = 不限制（任何人可执行受白名单约束的维护命令）；建议生产环境填入维护者。
maintenance_allowed_user_ids = []
# 默认关闭昂贵向量重建；开启前请确认白名单或接受空白名单=开放。
allow_vector_rebuild = false

[web_search]
enabled_engines = ["duckduckgo"]
timeout_seconds = 30.0
max_results = 10
searxng_url = ""
tavily_api_key = ""
you_base_url = ""
you_api_key = ""

